version: 2
sources:
  - name: retail_silver
    description: PySpark-cleaned retail orders loaded from local Parquet into Snowflake.
    database: RETAIL_PORTFOLIO
    schema: RAW
    tables:
      - name: silver_orders
        description: Cleaned order records with gross amount calculated by PySpark.
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: gross_amount
            data_tests: [not_null]
